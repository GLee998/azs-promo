<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Бутылка колы">
  <!-- Бутылка колы 0,5 л в стиле объёмных иконок: свет сверху слева, глянцевый пластик. -->
  <defs>
    <clipPath id="cbShape">
      <path d="M110 34 H146 V58 C146 72 178 84 180 116 V214 C180 236 166 248 146 248 H110 C90 248 76 236 76 214 V116 C78 84 110 72 110 58 Z"/>
    </clipPath>
    <linearGradient id="cbCola" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2A0C05"/>
      <stop offset=".28" stop-color="#6B2A12"/>
      <stop offset=".5" stop-color="#43180A"/>
      <stop offset="1" stop-color="#1C0703"/>
    </linearGradient>
    <linearGradient id="cbLabel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A3001F"/>
      <stop offset=".28" stop-color="#FF3B55"/>
      <stop offset=".5" stop-color="#EE0F33"/>
      <stop offset="1" stop-color="#8E001A"/>
    </linearGradient>
    <linearGradient id="cbCap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A3001F"/>
      <stop offset=".3" stop-color="#FF5468"/>
      <stop offset=".55" stop-color="#EE0F33"/>
      <stop offset="1" stop-color="#8E001A"/>
    </linearGradient>
    <linearGradient id="cbGloss" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".85"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="cbShade" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#3A1A5C" stop-opacity=".35"/>
      <stop offset="1" stop-color="#3A1A5C" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <ellipse cx="128" cy="248" rx="62" ry="8" fill="url(#cbShade)"/>

  <!-- пластик -->
  <path d="M110 34 H146 V58 C146 72 178 84 180 116 V214 C180 236 166 248 146 248 H110 C90 248 76 236 76 214 V116 C78 84 110 72 110 58 Z" fill="#D6ECF7" opacity=".45"/>
  <g clip-path="url(#cbShape)">
    <rect x="60" y="62" width="140" height="200" fill="url(#cbCola)"/>
    <ellipse cx="128" cy="63" rx="30" ry="4" fill="#8A4422" opacity=".7"/>
    <!-- пузырьки -->
    <g fill="#F7C9A8" opacity=".55">
      <circle cx="104" cy="96" r="2.5"/><circle cx="150" cy="104" r="2"/><circle cx="120" cy="84" r="1.8"/>
      <circle cx="140" cy="200" r="2.2"/><circle cx="100" cy="214" r="1.8"/><circle cx="158" cy="226" r="2.4"/>
    </g>
    <!-- рёбра у донышка -->
    <g stroke="#000" stroke-opacity=".28" stroke-width="4" fill="none">
      <path d="M70 198 Q128 206 186 198"/><path d="M70 216 Q128 224 186 216"/>
    </g>
    <!-- этикетка -->
    <rect x="60" y="122" width="140" height="64" fill="url(#cbLabel)"/>
    <path d="M60 160 C84 142 108 176 136 158 C152 148 170 150 200 152 L200 162 C170 160 154 160 138 170 C108 188 84 156 60 172 Z" fill="#fff"/>
    <rect x="60" y="122" width="140" height="4" fill="#fff" opacity=".2"/>
    <rect x="60" y="182" width="140" height="4" fill="#000" opacity=".2"/>
    <!-- глянец -->
    <rect x="90" y="70" width="12" height="172" rx="6" fill="url(#cbGloss)"/>
    <rect x="160" y="96" width="5" height="130" rx="2.5" fill="url(#cbGloss)" opacity=".45"/>
  </g>
  <path d="M110 34 H146 V58 C146 72 178 84 180 116 V214 C180 236 166 248 146 248 H110 C90 248 76 236 76 214 V116 C78 84 110 72 110 58 Z" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="2"/>

  <!-- капли конденсата -->
  <g fill="#fff">
    <ellipse cx="114" cy="104" rx="2.6" ry="3.4" opacity=".75"/><ellipse cx="148" cy="196" rx="3" ry="4" opacity=".6"/>
    <ellipse cx="104" cy="226" rx="2.2" ry="3" opacity=".6"/><ellipse cx="166" cy="128" rx="2" ry="2.8" opacity=".55"/>
  </g>

  <!-- горлышко и крышка -->
  <rect x="104" y="30" width="48" height="8" rx="4" fill="#EEF4F8" opacity=".9"/>
  <rect x="106" y="6" width="44" height="28" rx="7" fill="url(#cbCap)"/>
  <g stroke="#6E0013" stroke-opacity=".4" stroke-width="2.5">
    <path d="M114 12 V28"/><path d="M121 12 V28"/><path d="M128 12 V28"/><path d="M135 12 V28"/><path d="M142 12 V28"/>
  </g>
  <rect x="106" y="6" width="44" height="7" rx="3.5" fill="#fff" opacity=".3"/>
</svg>
