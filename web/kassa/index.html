<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Касса: выдача машинок</title>
  <link rel="icon" href="shared/img/caravan-truck.svg" type="image/svg+xml">
  <link rel="stylesheet" href="shared/vendor/fonts.css">
  <link rel="stylesheet" href="shared/style.css">
</head>
<body>
  <div class="topbar">
    <h1><img src="shared/img/logo-white.svg" alt="Partner Neft">Касса</h1>
    <div class="actions hidden" id="toolbar" style="margin:0">
      <button class="btn small" id="logout">Выйти</button>
    </div>
  </div>

  <main class="login" id="loginView">
    <img src="shared/img/caravan-truck.svg" alt="">
    <form class="panel" id="loginForm">
      <h2 style="margin-top:0">Вход для кассира</h2>
      <label for="login">Логин</label>
      <input id="login" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required>
      <label for="password">Пароль</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <button class="btn" type="submit" id="loginBtn">Войти</button>
      <div class="error hidden" id="loginErr"></div>
    </form>
  </main>

  <main class="wrap" id="kassaView" style="margin-top:20px" hidden>
    <div class="kassa-bar">
      <span class="station-chip" id="stationChip"></span>
      <input type="search" id="q" placeholder="Код заявки, например 123 ABC" style="flex:1 1 200px">
    </div>
    <p class="hint" style="margin-top:0">Клиент показывает экран с кодом заявки. Найдите эту заявку, сверьте чек и выдайте машинку. Список обновляется сам.</p>

    <h2 class="section-title" style="margin-top:20px">Ждут выдачи</h2>
    <div id="queue"></div>

    <h2 class="section-title">Недавно выдано</h2>
    <div class="card" id="recent"></div>
  </main>

  <div class="lightbox hidden" id="lightbox"><img alt="Фото чека"></div>
  <div class="toast hidden" id="toast" role="status"></div>

  <script src="shared/config.js"></script>
  <script src="shared/api.js"></script>
  <script src="kassa.js"></script>
</body>
</html>
