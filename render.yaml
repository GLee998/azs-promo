# Render Blueprint: API + бесплатная база Postgres.
# Развернуть: https://render.com/deploy?repo=https://github.com/GLee998/azs-promo
services:
  - type: web
    name: azs-promo-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase:
          name: azs-promo-db
          property: connectionString
      - key: ADMIN_PASSWORD
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://glee998.github.io
      - key: SMS_REQUIRED
        value: "true"
      - key: DEMO_SMS
        value: "true"

databases:
  - name: azs-promo-db
    plan: free
