# Render Blueprint: API, база и три отдельных сайта (клиент, касса, админка).
services:
  # API: только данные, страниц не отдаёт.
  - type: web
    name: azs-promo-web
    region: virginia
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase:
          name: azs-promo-db
          property: connectionString
      # Пароли реестра и кассы генерирует Render: Dashboard → azs-promo-web → Environment.
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: CASHIER_PASSWORD
        generateValue: true
      - key: SERVE_WEB
        value: "false"
      # Подтверждение номера кодом выключено.
      - key: SMS_REQUIRED
        value: "false"
      - key: DRAW_RESET_ALLOWED
        value: "true"
      - key: ALLOWED_ORIGINS
        value: https://karavan-client.onrender.com,https://karavan-kassa.onrender.com,https://karavan-admin-ezbb.onrender.com

  - type: web
    name: karavan-client
    runtime: static
    buildCommand: ./build.sh client
    staticPublishPath: dist/client
    envVars:
      - key: API_URL
        value: https://azs-promo-web.onrender.com

  - type: web
    name: karavan-kassa
    runtime: static
    buildCommand: ./build.sh kassa
    staticPublishPath: dist/kassa
    headers:
      - path: /*
        name: X-Robots-Tag
        value: noindex
    envVars:
      - key: API_URL
        value: https://azs-promo-web.onrender.com

  - type: web
    name: karavan-admin
    runtime: static
    buildCommand: ./build.sh admin
    staticPublishPath: dist/admin
    headers:
      - path: /*
        name: X-Robots-Tag
        value: noindex
    envVars:
      - key: API_URL
        value: https://azs-promo-web.onrender.com
      - key: CLIENT_URL
        value: https://karavan-client.onrender.com/

databases:
  - name: azs-promo-db
    region: virginia
    plan: free
