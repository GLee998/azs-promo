# Render Blueprint: API + бесплатная база Postgres.
# Развернуть: https://render.com/deploy?repo=https://github.com/GLee998/azs-promo
services:
  - type: web
    name: azs-promo-web
    region: virginia
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase:
          name: azs-promo-db
          property: connectionString
      # Пароль реестра генерирует Render: Dashboard → azs-promo-api → Environment.
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://glee998.github.io
      # Пароль кассиров тоже генерирует Render.
      - key: CASHIER_PASSWORD
        generateValue: true

databases:
  - name: azs-promo-db
    region: virginia
    plan: free
