# Render Blueprint: тестовый стенд на бесплатном Render (API, база и три сайта).
# Боевой сервер — свой VPS, см. deploy/README.md.
#
# Учётки стенда: admin (маркетинг) и azs1 (кассир АЗС №1). Пароли Render генерирует сам:
# Dashboard → azs-promo-web → Environment → BOOTSTRAP_ADMIN_PASSWORD и BOOTSTRAP_CASHIER_PASSWORD.
# Бесплатный сервер засыпает после 15 минут без запросов: первый запрос после простоя идёт до минуты.
services:
  # API: только данные, страниц не отдаёт.
  - type: web
    name: azs-promo-web
    region: virginia
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # При каждом старте: база старого стенда (созданная до миграций) переводится под Alembic без потери
    # данных, применяются миграции, заводятся учётки из переменных окружения, запускается API.
    # --proxy-headers: адрес клиента из X-Forwarded-For прокси Render (нужен для лимитов частоты).
    startCommand: >-
      python manage.py adopt-legacy-db &&
      alembic upgrade head &&
      python manage.py ensure-user admin --role admin --password-env BOOTSTRAP_ADMIN_PASSWORD &&
      python manage.py ensure-user azs1 --role cashier --station 1 --password-env BOOTSTRAP_CASHIER_PASSWORD &&
      uvicorn app:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase:
          name: azs-promo-db
          property: connectionString
      - key: BOOTSTRAP_ADMIN_PASSWORD
        generateValue: true
      - key: BOOTSTRAP_CASHIER_PASSWORD
        generateValue: true
      - key: SERVE_WEB
        value: "false"
      # Подтверждение номера кодом выключено.
      - key: SMS_REQUIRED
        value: "false"
      - key: DRAW_RESET_ALLOWED
        value: "true"
      # У бесплатного сервера 512 МБ памяти: не больше двух фото в обработке одновременно.
      - key: PHOTO_WORKERS
        value: "2"
      - key: DB_POOL_SIZE
        value: "5"
      - key: ALLOWED_ORIGINS
        value: https://karavan-client.onrender.com,https://karavan-kassa.onrender.com,https://karavan-admin-ezbb.onrender.com

  - type: web
    name: karavan-client
    runtime: static
    buildCommand: ./build.sh client
    staticPublishPath: dist/client
    envVars:
      - key: API_URL
        value: https://azs-promo-web.onrender.com
      - key: DEMO
        value: "true"

  - type: web
    name: karavan-kassa
    runtime: static
    buildCommand: ./build.sh kassa
    staticPublishPath: dist/kassa
    headers:
      - path: /*
        name: X-Robots-Tag
        value: noindex
    envVars:
      - key: API_URL
        value: https://azs-promo-web.onrender.com
      - key: DEMO
        value: "true"

  - type: web
    name: karavan-admin
    runtime: static
    buildCommand: ./build.sh admin
    staticPublishPath: dist/admin
    headers:
      - path: /*
        name: X-Robots-Tag
        value: noindex
    envVars:
      - key: API_URL
        value: https://azs-promo-web.onrender.com
      - key: CLIENT_URL
        value: https://karavan-client.onrender.com/
      - key: DEMO
        value: "true"

databases:
  - name: azs-promo-db
    region: virginia
    plan: free
